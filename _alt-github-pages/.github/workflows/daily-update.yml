name: Daily Soreno Update

on:
  schedule:
    # 11:00 UTC ≈ 7:00am US Eastern, before market open. Adjust as you like.
    - cron: '0 11 * * *'
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab
  push:
    branches: [main]      # also runs once on first push so the site isn't empty

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  generate-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate today's content
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/generate.mjs

      - name: Commit updated data.json
        run: |
          git config user.name "soreno-bot"
          git config user.email "actions@github.com"
          git add site/data.json
          git diff --quiet --cached || git commit -m "Daily update: $(date -u +%Y-%m-%d)"
          git push

      - name: Upload site as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
